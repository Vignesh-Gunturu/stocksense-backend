server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventory_predictor?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jackson.serialization.write-dates-as-timestamps=false

app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-to-something-long-and-random-32chars-min}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.demo.seed=${DEMO_SEED:true}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.inventory=INFO